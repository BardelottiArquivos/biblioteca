{# templates/components/_accessibility_bar.html #}
<div class="accessibility-bar">
    <button id="toggle-contrast" type="button" title="Alto Contraste" aria-label="Ativar alto contraste">◐</button>
    <button id="toggle-dyslexia" type="button" title="Fonte Dislexia" aria-label="Ativar fonte para dislexia">Dy</button>
    <button id="increase-font" type="button" title="Aumentar Fonte" aria-label="Aumentar fonte">A+</button>
    <button id="decrease-font" type="button" title="Diminuir Fonte" aria-label="Diminuir fonte">A-</button>
</div>
