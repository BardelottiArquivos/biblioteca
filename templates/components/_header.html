{# templates/components/_header.html #}
<header class="header">
    <div class="container header-content">
        <a href="{% url 'core:home' %}" class="logo">Biblioteca do Saber</a>

        <nav class="nav">
            <a href="{% url 'acervo:lista' %}">Acervo</a>

            {% if user.is_authenticated %}
                <a href="{% url 'dashboard:index' %}">Dashboard</a>
                <a href="{% url 'chat:lista' %}">Chat</a>
                <a href="{% url 'gamificacao:ranking' %}">Ranking</a>
                <a href="{% url 'usuarios:perfil' %}">{{ user.username }}</a>
                <a href="{% url 'usuarios:logout' %}">Sair</a>
            {% else %}
                <a href="{% url 'usuarios:login' %}">Entrar</a>
                <a href="{% url 'usuarios:cadastro' %}">Cadastrar</a>
            {% endif %}
        </nav>
    </div>
</header>
