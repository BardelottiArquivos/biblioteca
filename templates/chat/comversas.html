{# templates/chat/conversa.html #}
{% extends 'base.html' %}

{% block title %}Conversa{% endblock %}

{% block content %}
<h1>💬 Conversa</h1>

<div id="chat-mensagens" class="chat-mensagens">
    {% for msg in mensagens %}
        <div class="mensagem">
            <strong>{{ msg.remetente.username }}</strong>: {{ msg.conteudo }}
        </div>
    {% endfor %}
</div>

<form id="chat-form" class="chat-form">
    {% csrf_token %}
    <input type="text" id="chat-input" placeholder="Digite sua mensagem..." class="form-control">
    <button type="submit" class="btn btn-primary">Enviar</button>
</form>

<script>
    const conversaId = {{ conversa.id }};
    const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const socket = new WebSocket(
        `${protocol}//${window.location.host}/ws/chat/${conversaId}/`
    );

    socket.onmessage = (e) => {
        const data = JSON.parse(e.data);
        const container = document.getElementById('chat-mensagens');
        const div = document.createElement('div');
        div.className = 'mensagem';
        div.innerHTML = `<strong>${data.remetente}:</strong> ${data.mensagem}`;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    };

    document.getElementById('chat-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        if (input.value.trim()) {
            socket.send(JSON.stringify({ mensagem: input.value }));
            input.value = '';
        }
    });
</script>
{% endblock %}
