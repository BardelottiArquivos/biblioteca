{# templates/usuarios/cadastro.html #}
{% extends 'base.html' %}

{% block title %}Criar Conta - Biblioteca do Saber{% endblock %}

{% block content %}
<h1>Criar Conta</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Cadastrar</button>
</form>

<p>Já tem conta? <a href="{% url 'usuarios:login' %}">Entrar</a></p>
{% endblock %}
