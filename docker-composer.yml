# docker-compose.yml
# ==============================================
# ORQUESTRAÇÃO - BIBLIOTECA DO SABER
# ==============================================
version: '3.8'

services:
  # ========== PostgreSQL ==========
  db:
    image: postgres:15-alpine
    container_name: biblioteca_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-biblioteca_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biblioteca_pass}
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca_saber}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biblioteca_user} -d ${POSTGRES_DB:-biblioteca_saber}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: always
    networks:
      - biblioteca_net

  # ========== Redis ==========
  redis:
    image: redis:7-alpine
    container_name: biblioteca_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - biblioteca_net

  # ========== Django (Web) ==========
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca_web
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn biblioteca_do_saber.wsgi:application
                     --bind 0.0.0.0:8000
                     --workers 4
                     --timeout 120
                     --access-logfile -
                     --error-logfile -"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=biblioteca_do_saber.settings.production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-biblioteca_user}:${POSTGRES_PASSWORD:-biblioteca_pass}@db:5432/${POSTGRES_DB:-biblioteca_saber}
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_URL=redis://redis:6379/1
      - REDIS_CHANNEL_URL=redis://redis:6379/2
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - biblioteca_net

  # ========== Celery Worker ==========
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca_celery
    command: celery -A biblioteca_do_saber worker -l info -c 4
    volumes:
      - .:/app
      - media_volume:/app/media
      - ./logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=biblioteca_do_saber.settings.production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-biblioteca_user}:${POSTGRES_PASSWORD:-biblioteca_pass}@db:5432/${POSTGRES_DB:-biblioteca_saber}
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - biblioteca_net

  # ========== Celery Beat (agendador) ==========
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblioteca_celery_beat
    command: celery -A biblioteca_do_saber beat -l info
    volumes:
      - .:/app
      - ./logs:/app/logs
    environment:
      - DJANGO_SETTINGS_MODULE=biblioteca_do_saber.settings.production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-biblioteca_user}:${POSTGRES_PASSWORD:-biblioteca_pass}@db:5432/${POSTGRES_DB:-biblioteca_saber}
      - POSTGRES_HOST=db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - biblioteca_net

  # ========== Nginx (proxy reverso) ==========
  nginx:
    image: nginx:alpine
    container_name: biblioteca_nginx
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    restart: always
    networks:
      - biblioteca_net

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:

networks:
  biblioteca_net:
    driver: bridge
